services:
  - type: web
    name: toyota-advisor-demo
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: Gemini__Model
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false

